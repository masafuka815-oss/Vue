 <!DOCTYPE html>
<html>
	<title>Vue.jsのサンプル</title>
	<script src="https://unpkg.com/vue@3.0.0/dist/vue.global.js"></script>
<body>
	<h1>Vue3</h1>
	<div id="app">
		<p>{{message}}</p>
		<p>{{count}}</p>
		<p>{{user.lastName}}</p>
		<p>{{colors[1]}}</p>
	</div>
	<script>
		const appdata = {
			data() {
				return {
					message: "Hello Vue",
					count: 77,
					user: {
						lastName: "Fukamachi",
						firstName:'Masaaki',
						country:'Japan',
					},
					colors: ['Red','Green','Blue']
				}
			}
		}

		Vue.createApp(appdata).mount('#app')
	</script>
</body>
</html>
